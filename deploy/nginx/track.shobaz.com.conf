server {
    server_name track.shobaz.com;

    # Keep SGTM loader/debug endpoints reachable for Google Tag Assistant.
    # Do not user-agent block gtm.js/gtag.js; preview/debug requests may look
    # crawler-like and a 204 response makes Tag Assistant report no tags.
    location ~ ^/(gtm\.js|gtag/js) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Crawlers can fetch the loader scripts for previews, but they should not
    # create server-side analytics/PageView traffic or consume SGTM quota.
    location ~ ^/(g/collect|data|collect|mp/collect) {
        if ($http_user_agent ~* "(meta-externalagent|facebookexternalhit|meta-externalads|Googlebot|Bytespider|Applebot|bot|crawler|spider)") {
            return 204;
        }

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/track.shobaz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/track.shobaz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = track.shobaz.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name track.shobaz.com;
    return 404;
}
